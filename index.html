<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Corte de Produção</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #06080d; --glass: rgba(18,23,31,0.65); --glass-border: rgba(255,255,255,0.08);
      --glass-hover: rgba(18,23,31,0.85); --primary: #5c9eff; --primary-dark: #3e7fd9;
      --danger: #ff506e; --success: #00e6a0; --warning: #ffb347; --text: #e8ecf2;
      --text-secondary: #94a3b8; --shadow: 0 8px 32px rgba(0,0,0,0.4);
      --radius: 16px; --radius-sm: 10px; --transition: 0.25s cubic-bezier(0.4,0,0.2,1);
    }
    body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; min-height: 100dvh; overflow-x: hidden; }
    body::before {
      content: ''; position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(circle at 20% 20%, rgba(0,200,150,0.07) 0%, transparent 50%),
                  radial-gradient(circle at 80% 80%, rgba(92,158,255,0.07) 0%, transparent 50%);
      pointer-events: none;
    }
    .hidden { display: none !important; }
    /* Loading */
    .loading-screen { position: fixed; inset: 0; background: #06090f; display: flex; align-items: center; justify-content: center; z-index: 9999; }
    .loading-logo { text-align: center; }
    .loading-icon { font-size: 48px; margin-bottom: 12px; animation: pulse 1.8s ease-in-out infinite; filter: drop-shadow(0 0 20px rgba(92,158,255,0.6)); }
    @keyframes pulse { 0%,100%{transform:scale(1)}50%{transform:scale(1.15)} }
    .loading-logo h2 { font-size: 20px; color: var(--text); margin-bottom: 16px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; }
    .loading-bar { width: 200px; height: 3px; background: rgba(255,255,255,0.05); border-radius: 2px; overflow: hidden; margin: 0 auto; }
    .loading-fill { width: 60%; height: 100%; background: linear-gradient(90deg,#5c9eff,#00e6a0); border-radius: 2px; animation: lslide 1.2s ease-in-out infinite; }
    @keyframes lslide { 0%{transform:translateX(-100%)}100%{transform:translateX(260%)} }
    /* Layout */
    .app { max-width: 640px; margin: 0 auto; padding: 16px; padding-bottom: 48px; position: relative; z-index: 1; }
    @keyframes fadeSlideUp { from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)} }
    @keyframes fadeIn { from{opacity:0}to{opacity:1} }
    @keyframes modalIn { from{opacity:0;transform:scale(0.92) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)} }
    /* Header */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      padding: 14px 20px; border-radius: var(--radius);
      box-shadow: 0 8px 32px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.06);
      margin-bottom: 16px; position: sticky; top: 8px; z-index: 100; border: 1px solid var(--glass-border);
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-icon { font-size: 28px; filter: drop-shadow(0 0 8px #5c9eff); }
    .header-title { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; }
    .header-subtitle { font-size: 11px; color: var(--text-secondary); }
    .btn-galeria {
      background: rgba(92,158,255,0.12); color: var(--primary); border: 1px solid rgba(92,158,255,0.3);
      padding: 8px 18px; border-radius: 20px; font-weight: 600; font-size: 13px; cursor: pointer; transition: var(--transition);
    }
    .btn-galeria:hover { background: rgba(92,158,255,0.25); box-shadow: 0 0 20px rgba(92,158,255,0.3); }
    /* Form section */
    .form-section {
      background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; margin-bottom: 12px;
      border: 1px solid var(--glass-border); animation: fadeSlideUp 0.4s ease-out;
    }
    .section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .section-icon { font-size: 20px; }
    .section-title { font-size: 14px; font-weight: 600; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group.full-width { grid-column: 1/-1; }
    .form-label { font-size: 12px; font-weight: 500; color: var(--text-secondary); }
    .form-label.required::after { content: ' *'; color: var(--danger); }
    .form-input {
      width: 100%; padding: 10px 12px; border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm); font-size: 14px; font-family: inherit;
      background: rgba(255,255,255,0.03); color: var(--text); transition: all var(--transition);
    }
    .form-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(92,158,255,0.15); }
    .form-input::placeholder { color: #4a5568; }
    .form-input.error { border-color: var(--danger); }
    select.form-select { position: absolute; opacity: 0; pointer-events: none; height: 0; width: 0; }
    .custom-select-wrapper { position: relative; }
    .custom-select-btn {
      width: 100%; padding: 10px 30px 10px 12px; border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm); font-size: 14px; font-family: inherit;
      background: rgba(255,255,255,0.03); color: var(--text); cursor: pointer; text-align: left; position: relative;
    }
    .custom-select-btn::after { content: '▾'; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); font-size: 12px; }
    .custom-select-btn.placeholder { color: #4a5568; }
    .custom-select-btn.error { border-color: var(--danger); }
    /* Photo slots */
    .slots-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .photo-slot { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
    .slot-preview {
      width: 100%; aspect-ratio: 4/3; border-radius: var(--radius-sm);
      border: 2px dashed rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.02); overflow: hidden; transition: var(--transition); position: relative;
    }
    .slot-preview:hover { border-color: var(--primary); background: rgba(92,158,255,0.05); }
    .slot-preview.captured { border-style: solid; border-color: var(--success); }
    .slot-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .slot-camera-icon { font-size: 26px; opacity: 0.35; }
    .slot-done-badge {
      position: absolute; top: 5px; right: 5px; background: var(--success); color: #06080d;
      border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center;
      justify-content: center; font-size: 11px; font-weight: 700;
    }
    .slot-retake {
      position: absolute; bottom: 4px; right: 4px; background: rgba(0,0,0,0.65);
      color: white; border-radius: 10px; padding: 2px 7px; font-size: 10px; font-weight: 600;
    }
    .slot-label { font-size: 11px; color: var(--text-secondary); font-weight: 500; text-align: center; }
    /* Info text */
    .info-text { text-align: center; color: var(--text-secondary); padding: 24px; font-size: 13px; }
    /* Submit */
    .form-submit-area { margin-top: 20px; display: flex; justify-content: center; }
    .btn-submit {
      display: flex; align-items: center; gap: 8px; padding: 14px 36px;
      background: rgba(0,230,160,0.08); color: var(--success);
      border: 2px solid rgba(0,230,160,0.5); border-radius: 30px;
      font-size: 15px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
      cursor: pointer; box-shadow: 0 0 20px rgba(0,230,160,0.15); transition: all 0.35s ease;
    }
    .btn-submit:hover { background: var(--success); color: #06080d; box-shadow: 0 0 40px rgba(0,230,160,0.5); transform: translateY(-2px); }
    .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    /* Modals */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.72); z-index: 1000;
      display: flex; align-items: center; justify-content: center; padding: 16px;
      backdrop-filter: blur(4px); animation: fadeIn 0.25s ease-out;
    }
    .modal-overlay-select { z-index: 1200; }
    .modal-overlay-password { z-index: 1300; }
    .modal {
      background: var(--glass-hover); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
      border-radius: var(--radius); padding: 24px; width: 100%; max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5); border: 1px solid var(--glass-border); animation: modalIn 0.3s ease-out;
    }
    .modal-full { max-width: 95vw; max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .modal-header h3 { font-size: 17px; font-weight: 600; }
    .modal-icon { font-size: 22px; }
    .modal-close-btn { margin-left: auto; background: none; border: none; cursor: pointer; font-size: 20px; color: var(--text-secondary); }
    .modal-desc { font-size: 13px; color: var(--text-secondary); margin-bottom: 12px; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
    .btn-primary { padding: 10px 20px; border-radius: 20px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; background: var(--primary); color: #fff; transition: var(--transition); }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary { padding: 10px 20px; border-radius: 20px; border: 1px solid var(--glass-border); font-size: 13px; font-weight: 600; cursor: pointer; background: rgba(255,255,255,0.04); color: var(--text); transition: var(--transition); }
    .btn-secondary:hover { background: rgba(255,255,255,0.08); }
    /* Select modal */
    .select-modal-content { max-height: 55vh; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; margin: 8px 0; }
    .select-option { padding: 12px 16px; border-radius: var(--radius-sm); cursor: pointer; font-size: 14px; border: 1px solid transparent; transition: var(--transition); }
    .select-option:hover { background: rgba(92,158,255,0.12); border-color: rgba(92,158,255,0.2); }
    .select-option.selected { background: rgba(0,230,160,0.12); border-color: rgba(0,230,160,0.3); color: var(--success); }
    /* Gallery */
    .gallery-filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 16px; }
    .filter-group { display: flex; flex-direction: column; gap: 4px; }
    .gallery-stats { font-size: 12px; color: var(--text-secondary); margin-bottom: 12px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .gallery-machine-section { margin-bottom: 20px; }
    .gallery-machine-title {
      font-size: 12px; font-weight: 700; color: var(--primary); margin-bottom: 10px;
      padding-bottom: 6px; border-bottom: 1px solid var(--glass-border);
      text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px;
    }
    .gallery-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .gallery-card {
      border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--glass-border);
      background: rgba(255,255,255,0.02); cursor: pointer; transition: var(--transition);
    }
    .gallery-card:hover { border-color: var(--primary); transform: scale(1.02); }
    .gallery-card-img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; background: rgba(255,255,255,0.03); }
    .gallery-card-caption { padding: 6px 8px; font-size: 10px; color: var(--text-secondary); line-height: 1.5; }
    .gallery-card-caption strong { color: var(--text); display: block; font-size: 11px; }
    .gallery-empty { text-align: center; padding: 40px; color: var(--text-secondary); font-size: 13px; }
    /* Fullscreen */
    .fullscreen-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.97); z-index: 4000;
      display: flex; align-items: center; justify-content: center; animation: fadeIn 0.2s ease-out;
    }
    .fullscreen-overlay img { max-width: 100%; max-height: 100dvh; object-fit: contain; }
    .fullscreen-close {
      position: fixed; top: 16px; right: 16px; background: rgba(255,255,255,0.12);
      border: none; color: white; font-size: 22px; width: 42px; height: 42px;
      border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 4001;
    }
    /* Upload overlay */
    .upload-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 5000;
      display: flex; align-items: center; justify-content: center; backdrop-filter: blur(6px);
    }
    .upload-card {
      background: var(--glass-hover); border: 1px solid var(--glass-border); border-radius: var(--radius);
      padding: 28px 36px; text-align: center;
    }
    .upload-icon { font-size: 40px; margin-bottom: 10px; animation: pulse 1.5s infinite; }
    .upload-card p { font-size: 14px; color: var(--text-secondary); margin-top: 4px; }
    .upload-card strong { color: var(--text); font-size: 15px; }
    /* Toast */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--glass-hover); backdrop-filter: blur(20px); color: #fff;
      padding: 12px 28px; border-radius: 24px; font-size: 13px; z-index: 6000;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5); border: 1px solid var(--glass-border);
      animation: fadeSlideUp 0.3s ease-out; white-space: nowrap;
    }
    /* Date */
    .date-input-wrapper { position: relative; display: flex; }
    .date-input-wrapper .form-input { padding-right: 38px; }
    .date-toggle-btn { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); background: none; border: none; font-size: 16px; cursor: pointer; padding: 4px 8px; opacity: 0.7; }
    .calendar-popup {
      position: absolute; top: calc(100% + 4px); left: 0; z-index: 400;
      background: var(--glass-hover); backdrop-filter: blur(24px); border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm); box-shadow: 0 12px 40px rgba(0,0,0,0.5); padding: 12px; min-width: 240px;
      animation: fadeSlideUp 0.2s ease-out;
    }
    .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: 600; font-size: 13px; }
    .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; text-align: center; font-size: 12px; color: var(--text-secondary); }
    .cal-day { padding: 6px; cursor: pointer; border-radius: 50%; color: var(--text); transition: var(--transition); }
    .cal-day:hover { background: rgba(92,158,255,0.15); }
    .cal-day.today { border: 1px solid var(--primary); color: var(--primary); font-weight: 600; }
    /* Responsive */
    @media (max-width: 480px) {
      .form-grid { grid-template-columns: 1fr; }
      .modal { padding: 16px; }
    }
    @media (min-width: 768px) {
      .app { max-width: 1400px; width: 95%; padding: 24px 32px; }
      .form-grid { grid-template-columns: repeat(3,1fr); }
      .slots-grid { grid-template-columns: repeat(4,1fr); }
      .gallery-grid { grid-template-columns: repeat(4,1fr); }
      .header { padding: 18px 28px; }
      .header-title { font-size: 20px; }
    }
  </style>
</head>
<body>
<div id="loading-screen" class="loading-screen">
  <div class="loading-logo"><div class="loading-icon">📷</div><h2>Corte de Produção</h2><div class="loading-bar"><div class="loading-fill"></div></div></div>
</div>

          <label class="form-label required">Data</label>

        <div class="form-group"><label class="form-label required">Linha</label><div class="custom-select-wrapper" id="wrapper-linha"><select id="linha" class="form-select" data-placeholder="Selecione a linha"><option value="">Selecione a linha</option><option>L512</option><option>L513</option><option>L514</option></select></div></div>
        <div class="form-group"><label class="form-label required">Produto</label><div class="custom-select-wrapper" id="wrapper-produto"><select id="produto" class="form-select" data-placeholder="Selecione o produto"></select></div></div>
        <div class="form-group"><label class="form-label required">Embalagem</label><div class="custom-select-wrapper" id="wrapper-embalagem"><select id="embalagem" class="form-select" data-placeholder="Selecione a embalagem"></select></div></div>
        <div class="form-group full-width"><label class="form-label required">Sua Máquina</label><div class="custom-select-wrapper" id="wrapper-maquina"><select id="maquina" class="form-select" data-placeholder="Selecione a máquina"><option value="">Selecione a máquina</option></select></div></div>
      </div>
    </div>
    <div id="photo-slots-container"><p class="info-text">Selecione <strong>Linha</strong> e <strong>Máquina</strong></p></div>
    <div class="form-submit-area"><button type="submit" class="btn-submit" id="btn-submit">💾 Salvar Fotos</button></div>
  </form>
</div>

<!-- Select modal -->
<div id="modal-select" class="modal-overlay modal-overlay-select hidden">
  <div class="modal"><div class="modal-header"><span class="modal-icon">📋</span><h3 id="modal-select-title">Selecionar</h3><button class="modal-close-btn" onclick="closeSelectModal()">✕</button></div><div id="modal-select-content" class="select-modal-content"></div></div>
</div>

<!-- Gallery modal -->
<div id="modal-gallery" class="modal-overlay hidden">
  <div class="modal modal-full">
    <div class="modal-header"><span class="modal-icon">📸</span><h3>Galeria de Fotos</h3><button class="modal-close-btn" onclick="document.getElementById('modal-gallery').classList.add('hidden')">✕</button></div>
    <div class="gallery-filters">
      <div class="filter-group">
        <label class="form-label">Data</label>
        <div class="date-input-wrapper">
          <input type="text" id="filter-date" class="form-input" placeholder="DD/MM/AAAA" readonly style="min-width:140px">
          <button type="button" class="date-toggle-btn" onclick="toggleGalleryCalendar()">📅</button>
          <div id="gallery-calendar-popup" class="calendar-popup hidden"></div>
        </div>
      </div>
      <div class="filter-group">
        <label class="form-label">Linha</label>
        <div class="custom-select-wrapper" id="wrapper-filter-linha">
          <select id="filter-linha" class="form-select" data-placeholder="Todas as linhas"><option value="">Todas as linhas</option><option>L512</option><option>L513</option><option>L514</option></select>
        </div>

      <button class="btn-primary" onclick="loadAndRenderGallery()">🔍 Filtrar</button>

    <div class="gallery-stats" id="gallery-stats"></div>

    <div style="margin-top:16px;display:flex;justify-content:flex-end;">
      <button class="btn-secondary" onclick="openPasswordModal()" style="font-size:11px;padding:7px 14px;">🗑️ Limpar +3 meses</button>
    </div>
  </div>
</div>

<!-- Password modal -->
<div id="modal-password" class="modal-overlay modal-overlay-password hidden">
  <div class="modal">
    <div class="modal-header"><span class="modal-icon">🔒</span><h3>Acesso Restrito</h3></div>

    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

    Inspetores:  [{ id:'chk1',     label:'CHK 1' }, { id:'stratec1', label:'Stratec 1' }, { id:'chk2', label:'CHK 2' }, { id:'stratec2', label:'Stratec 2' }],
    Empacotadora:[{ id:'khs',      label:'KHS Pacotes' }, { id:'epc34', label:'EPC Mead 3+4' }],
    Paletizadora:[{ id:'pl09',     label:'PL 09' }, { id:'pl10', label:'PL 10' }, { id:'fracao', label:'Fração' }]
  },
  L514: {
    Enchedora:   [{ id:'enc-med',  label:'Enchedora + Medidor' }],
    Inspetores:  [{ id:'helf',     label:'Helf' }, { id:'bbull', label:'Bbull' }],
    Empacotadora:[{ id:'epc-mead', label:'EPC Mead' }, { id:'epc-pack', label:'EPC Packmatic' }],
    Paletizadora:[{ id:'pl34f',    label:'PL 3 + PL 4 + Fração' }]
  }
};
const MACHINE_ORDER = ['Enchedora','Inspetores','Empacotadora','Paletizadora'];
const MACHINE_ICONS = { Enchedora:'🍺', Inspetores:'🔍', Empacotadora:'📦', Paletizadora:'🏗️' };

// Slot label → machine section
const SLOT_TO_SECTION = {};
Object.values(FOTOS_CONFIG).forEach(lc => Object.entries(lc).forEach(([m, slots]) => slots.forEach(s => { SLOT_TO_SECTION[s.label] = m; })));

// ── State ─────────────────────────────────────────────────────────────────────
let capturedPhotos = {}; // { slotId: { blob, previewUrl, label } }
let currentLinha = null, currentMaquina = null;
let PRODUTOS = ['1 - Antarctica 350ml','2 - Antarctica 269ml','3 - Skol 350ml','4 - Skol 269ml','5 - Brahma 350ml','6 - Brahma 269ml','7 - Brahma Duplo Malte 350ml','9 - Budweiser 350ml','10 - Budweiser 269ml','11 - Spaten 350ml','12 - Spaten 269ml','13 - Original 350ml','14 - Original 269ml','15 - Bohemia 350ml','16 - Bohemia 269ml','19 - Caracu 350ml','20 - Subzero 350ml','22 - Beats Senses 269ml','23 - Beats GT 269ml','24 - Beats Tropical 269ml','25 - Beats Caipirinha 350ml','27 - Red Mix 269ml','33 - Brutal Long Neck'];
let EMBALAGENS = ['Pack 8 Latas','Pack 12 Latas','Pack 12 Latas (Box/Papelão)','Pack 15 Latas','Pack 18 Latas'];

// ── Supabase helpers ──────────────────────────────────────────────────────────
async function dbFetch(path, opts = {}) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1${path}`, { ...opts, headers: { ...DB_HEADERS, ...(opts.headers||{}) } });
  if (!r.ok) throw new Error(await r.text());
  if (r.status === 204 || r.status === 201) return null;
  const text = await r.text();
  if (!text) return null;
  return JSON.parse(text);
}

async function uploadToStorage(blob, path) {
  const r = await fetch(`${SUPABASE_URL}/storage/v1/object/fotos-corte/${path}`, {
    method: 'POST',
    headers: { 'Authorization':`Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type':'image/jpeg', 'x-upsert':'true' },
    body: blob
  });
  if (!r.ok) throw new Error(await r.text());
  return `${SUPABASE_URL}/storage/v1/object/public/fotos-corte/${path}`;
}

async function deleteFromStorage(paths) {
  if (!paths.length) return;
  await fetch(`${SUPABASE_URL}/storage/v1/object/fotos-corte`, {
    method: 'DELETE',
    headers: { 'Authorization':`Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type':'application/json' },
    body: JSON.stringify({ prefixes: paths })
  });
}

// ── Image compression ─────────────────────────────────────────────────────────
async function compressImage(file) {
  return new Promise((resolve) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const maxDim = 900;
      let w = img.width, h = img.height;
      if (w > h && w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; }
      else if (h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      canvas.toBlob(resolve, 'image/jpeg', 0.78);
    };
    img.onerror = () => resolve(file);
    img.src = url;
  });
}

// ── UI helpers ────────────────────────────────────────────────────────────────
function showToast(msg, dur = 2800) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.add('hidden'), dur);
}

function showUploadOverlay(text) {
  let el = document.getElementById('upload-overlay');
  if (!el) {
    el = document.createElement('div'); el.id = 'upload-overlay'; el.className = 'upload-overlay';
    el.innerHTML = `<div class="upload-card"><div class="upload-icon">☁️</div><strong>${text}</strong><p>Aguarde...</p></div>`;
    document.body.appendChild(el);
  } else { el.querySelector('strong').textContent = text; el.classList.remove('hidden'); }
}
function hideUploadOverlay() { const el = document.getElementById('upload-overlay'); if (el) el.classList.add('hidden'); }

function productFirstName(prod) { const p = prod.split(' - '); return p.length > 1 ? p[1].split(' ')[0] : prod; }

// ── Custom selects ────────────────────────────────────────────────────────────
function buildCustomSelects() {
  document.querySelectorAll('select.form-select').forEach(sel => {
    const wrap = sel.closest('.custom-select-wrapper'); if (!wrap) return;
    const old = wrap.querySelector('.custom-select-btn'); if (old) old.remove();
    const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'custom-select-btn';
    const opt = sel.options[sel.selectedIndex];
    btn.textContent = (opt && opt.value) ? opt.textContent : (sel.dataset.placeholder || 'Selecione...');
    if (!opt || !opt.value) btn.classList.add('placeholder');
    btn.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); openSelectModal(sel); });
    wrap.appendChild(btn);
  });
}

function openSelectModal(sel) {
  const opts = Array.from(sel.options);
  document.getElementById('modal-select-title').textContent = sel.dataset.placeholder || 'Selecionar';
  const content = document.getElementById('modal-select-content');
  content.innerHTML = opts.map(o => `<div class="select-option${o.value===sel.value?' selected':''}" data-value="${o.value}" data-text="${o.textContent}">${o.value===''?'〈nenhum〉':o.textContent}</div>`).join('');
  content.querySelectorAll('.select-option').forEach(div => {
    div.addEventListener('click', () => {
      sel.value = div.dataset.value;
      const wrap = sel.closest('.custom-select-wrapper');
      if (wrap) { const b = wrap.querySelector('.custom-select-btn'); if(b){ b.textContent = div.dataset.value ? div.dataset.text : (sel.dataset.placeholder||'Selecione...'); b.classList.toggle('placeholder', !div.dataset.value); } }
      sel.dispatchEvent(new Event('change', {bubbles:true})); closeSelectModal();
    });
  });
  document.getElementById('modal-select').classList.remove('hidden');
}
function closeSelectModal() { document.getElementById('modal-select').classList.add('hidden'); }

function populateSelect(id, items, placeholder) {
  const s = document.getElementById(id);
  s.innerHTML = `<option value="">${placeholder}</option>`;
  items.forEach(i => { const o = document.createElement('option'); o.value = i; o.textContent = i; s.appendChild(o); });
  setTimeout(buildCustomSelects, 30);
}

// ── Calendar ──────────────────────────────────────────────────────────────────
function toggleCalendar() {
  const p = document.getElementById('calendar-popup');
  if (p.classList.contains('hidden')) { renderCalendarInto('calendar-popup', 'data'); p.classList.remove('hidden'); }
  else p.classList.add('hidden');
}
function toggleGalleryCalendar() {
  const p = document.getElementById('gallery-calendar-popup');
  if (p.classList.contains('hidden')) { renderCalendarInto('gallery-calendar-popup', 'filter-date'); p.classList.remove('hidden'); }
  else p.classList.add('hidden');
}
function renderCalendarInto(popId, inputId) {
  const h = new Date(), m = h.getMonth(), a = h.getFullYear(), dias = new Date(a,m+1,0).getDate(), pd = new Date(a,m,1).getDay();
  let html = `<div class="cal-header"><span>${h.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</span></div><div class="cal-grid">`;
  ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].forEach(d => html += `<div style="font-weight:600;font-size:10px">${d}</div>`);
  for(let i=0;i<pd;i++) html+='<div></div>';
  for(let d=1;d<=dias;d++) html+=`<div class="cal-day${d===h.getDate()?' today':''}" onclick="selectCalDate('${inputId}','${popId}',${d})">${d}</div>`;
  html += '</div>';
  document.getElementById(popId).innerHTML = html;
}
function selectCalDate(inputId, popId, d) {
  const h = new Date();
  document.getElementById(inputId).value = new Date(h.getFullYear(), h.getMonth(), d).toLocaleDateString('pt-BR');
  document.getElementById(popId).classList.add('hidden');
}

// ── Photo capture ─────────────────────────────────────────────────────────────
function capturePhoto(slotId, slotLabel) {
  const fi = document.createElement('input');
  fi.type = 'file'; fi.accept = 'image/*'; fi.capture = 'environment'; fi.style.display = 'none';
  document.body.appendChild(fi);
  fi.addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) { document.body.removeChild(fi); return; }
    showToast('Processando...', 1500);
    const compressed = await compressImage(file);
    const previewUrl = URL.createObjectURL(compressed);
    capturedPhotos[slotId] = { blob: compressed, previewUrl, label: slotLabel };
    updateSlotPreview(slotId, previewUrl);
    document.body.removeChild(fi);
  });
  fi.addEventListener('cancel', () => document.body.removeChild(fi));
  fi.click();
}

function updateSlotPreview(slotId, previewUrl) {
  const preview = document.getElementById(`preview-${slotId}`);
  if (!preview) return;
  preview.classList.add('captured');
  preview.innerHTML = `<img src="${previewUrl}" alt="foto"><div class="slot-done-badge">✓</div><div class="slot-retake">refazer</div>`;
}

function renderPhotoSlots() {
  const container = document.getElementById('photo-slots-container');
  if (!currentLinha || !currentMaquina) {
    container.innerHTML = '<p class="info-text">Selecione <strong>Linha</strong> e <strong>Máquina</strong></p>'; return;
  }
  const slots = FOTOS_CONFIG[currentLinha]?.[currentMaquina];
  if (!slots) { container.innerHTML = '<p class="info-text" style="color:var(--danger)">Configuração não encontrada</p>'; return; }
  container.innerHTML = `
    <div class="form-section">
      <div class="section-header"><span class="section-icon">${MACHINE_ICONS[currentMaquina]||'📷'}</span><h2 class="section-title">${currentMaquina} — ${currentLinha}</h2></div>
      <div class="slots-grid">
        ${slots.map(s => `
          <div class="photo-slot" onclick="capturePhoto('${s.id}','${s.label}')">
            <div class="slot-preview" id="preview-${s.id}"><span class="slot-camera-icon">📷</span></div>
            <div class="slot-label">${s.label}</div>
          </div>`).join('')}
      </div>
    </div>`;
  // Restore previously captured previews if switching back
  Object.entries(capturedPhotos).forEach(([id, p]) => updateSlotPreview(id, p.previewUrl));
}

// ── Form save ─────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => { document.getElementById('loading-screen').classList.add('hidden'); document.getElementById('app').classList.remove('hidden'); }, 700);
  const hoje = new Date();
  document.getElementById('data').value = hoje.toLocaleDateString('pt-BR');
  document.getElementById('header-date').textContent = hoje.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  populateSelect('produto', PRODUTOS, 'Selecione o produto');
  populateSelect('embalagem', EMBALAGENS, 'Selecione a embalagem');
  buildCustomSelects();
  document.getElementById('linha').addEventListener('change', e => {
    currentLinha = e.target.value; currentMaquina = null; capturedPhotos = {};
    // Update machine options
    const maqSel = document.getElementById('maquina');
    maqSel.innerHTML = '<option value="">Selecione a máquina</option>';
    if (currentLinha && FOTOS_CONFIG[currentLinha]) {
      Object.keys(FOTOS_CONFIG[currentLinha]).forEach(m => {
        const o = document.createElement('option'); o.value = m; o.textContent = m; maqSel.appendChild(o);
      });
    }
    maqSel.value = ''; buildCustomSelects(); renderPhotoSlots();
  });
  document.getElementById('maquina').addEventListener('change', e => {
    currentMaquina = e.target.value; capturedPhotos = {}; renderPhotoSlots();
  });
  document.getElementById('production-form').addEventListener('submit', onSubmit);
  document.querySelectorAll('.modal-overlay').forEach(o => o.addEventListener('click', e => { if(e.target===o) o.classList.add('hidden'); }));
  document.addEventListener('click', e => { if(!e.target.closest('.date-input-wrapper')) document.querySelectorAll('.calendar-popup').forEach(c => c.classList.add('hidden')); });
});

async function onSubmit(e) {
  e.preventDefault();
  const data = document.getElementById('data').value;
  const nome = document.getElementById('seu-nome').value.trim();
  const turno = document.getElementById('turno').value;
  const linha = document.getElementById('linha').value;
  const produto = document.getElementById('produto').value;
  const embalagem = document.getElementById('embalagem').value;
  const maquina = document.getElementById('maquina').value;
  if (!data || !nome || !turno || !linha || !produto || !embalagem || !maquina) { showToast('Preencha todos os campos obrigatórios.'); return; }
  const fotos = Object.values(capturedPhotos);
  if (!fotos.length) { showToast('Tire pelo menos uma foto antes de salvar.'); return; }
  const btn = document.getElementById('btn-submit');
  btn.disabled = true;
  showUploadOverlay(`Enviando ${fotos.length} foto(s)...`);
  try {
    const ts = Date.now();
    const dataForPath = data.replace(/\//g, '-');
    for (let i = 0; i < fotos.length; i++) {
      const f = fotos[i];
      const path = `${linha}/${dataForPath}/${maquina}/${f.label.replace(/[^a-zA-Z0-9]/g,'_')}_${ts}_${i}.jpg`;
      const url = await uploadToStorage(f.blob, path);
      await dbFetch('/fotos', { method:'POST', headers:{'Prefer':'return=minimal'}, body: JSON.stringify({ linha, maquina: f.label, produto, embalagem, dados: data, turno, url }) });
    }
    hideUploadOverlay();
    showToast(`${fotos.length} foto(s) salva(s)! ✅`);
    document.getElementById('production-form').reset();
    document.getElementById('data').value = new Date().toLocaleDateString('pt-BR');
    currentLinha = null; currentMaquina = null; capturedPhotos = {};
    document.getElementById('photo-slots-container').innerHTML = '<p class="info-text">Selecione <strong>Linha</strong> e <strong>Máquina</strong></p>';
    buildCustomSelects();
  } catch(err) {
    hideUploadOverlay();
    showToast('Erro ao salvar: ' + err.message);
    console.error(err);
  }
  btn.disabled = false;
}

// ── Gallery ───────────────────────────────────────────────────────────────────
async function openGallery() {
  document.getElementById('modal-gallery').classList.remove('hidden');
  await loadAndRenderGallery();
}

async function loadAndRenderGallery() {
  const data = document.getElementById('filter-date').value;
  const linha = document.getElementById('filter-linha').value;
  const content = document.getElementById('gallery-content');
  const stats = document.getElementById('gallery-stats');
  content.innerHTML = '<p class="gallery-empty">⏳ Carregando...</p>';
  try {
    let query = '/fotos?order=savado_em.desc&limit=200';
    if (data) query += `&dados=eq.${encodeURIComponent(data)}`;
    if (linha) query += `&linha=eq.${encodeURIComponent(linha)}`;
    const fotos = await dbFetch(query);
    stats.textContent = `${fotos.length} foto(s)`;
    if (!fotos.length) { content.innerHTML = '<p class="gallery-empty">📭 Nenhuma foto encontrada.</p>'; return; }
    renderGallery(fotos, linha);
  } catch(err) {
    content.innerHTML = '<p class="gallery-empty" style="color:var(--danger)">Erro ao carregar fotos.</p>';
    console.error(err);
  }
}

function renderGallery(fotos, linhaFiltro) {
  const content = document.getElementById('gallery-content');
  // Group by machine section
  const grouped = {};
  fotos.forEach(f => {
    const section = SLOT_TO_SECTION[f.maquina] || f.maquina;
    if (!grouped[section]) grouped[section] = [];
    grouped[section].push(f);
  });
  const order = linhaFiltro ? MACHINE_ORDER : Object.keys(grouped);
  let html = '';
  (linhaFiltro ? MACHINE_ORDER : order).forEach(machine => {
    const items = grouped[machine];
    if (!items || !items.length) return;
    html += `<div class="gallery-machine-section">
      <div class="gallery-machine-title">${MACHINE_ICONS[machine]||'📷'} ${machine}</div>
      <div class="gallery-grid">
        ${items.map(f => `
          <div class="gallery-card" onclick="openFullScreen('${f.url}')">
            <img class="gallery-card-img" src="${f.url}" loading="lazy" alt="${f.maquina}">
            <div class="gallery-card-caption">
              <strong>${f.maquina}</strong>
              ${f.dados} · ${productFirstName(f.produto||'')}
              <br>${f.embalagem||''}
            </div>
          </div>`).join('')}
      </div>
    </div>`;
  });
  content.innerHTML = html || '<p class="gallery-empty">Nenhuma foto.</p>';
}

function clearGalleryFilters() {
  document.getElementById('filter-date').value = '';
  document.getElementById('filter-linha').value = '';
  buildCustomSelects(); loadAndRenderGallery();
}

// ── Full screen ───────────────────────────────────────────────────────────────
function openFullScreen(url) {
  const existing = document.getElementById('fullscreen-overlay');
  if (existing) existing.remove();
  const div = document.createElement('div'); div.id = 'fullscreen-overlay'; div.className = 'fullscreen-overlay';
  div.innerHTML = `<button class="fullscreen-close" onclick="document.getElementById('fullscreen-overlay').remove()">✕</button><img src="${url}" alt="foto">`;
  div.addEventListener('click', e => { if(e.target===div) div.remove(); });
  document.body.appendChild(div);
}

// ── Delete old photos ─────────────────────────────────────────────────────────
function openPasswordModal() { document.getElementById('password-input').value = ''; document.getElementById('modal-password').classList.remove('hidden'); }

async function confirmDelete() {
  const senha = document.getElementById('password-input').value;
  if (senha !== '6033') { showToast('Senha incorreta!'); return; }
  document.getElementById('modal-password').classList.add('hidden');
  showUploadOverlay('Deletando fotos antigas...');
  try {
    const cutoff = new Date(); cutoff.setMonth(cutoff.getMonth() - 3);
    const old = await dbFetch(`/fotos?savado_em=lt.${cutoff.toISOString()}&select=id,url`);
    if (!old.length) { hideUploadOverlay(); showToast('Nenhuma foto com mais de 3 meses.'); return; }
    // Extract storage paths from URLs
    const marker = '/object/public/fotos-corte/';
    const paths = old.map(f => { const i = f.url.indexOf(marker); return i>=0 ? f.url.substring(i+marker.length) : null; }).filter(Boolean);
    if (paths.length) await deleteFromStorage(paths);
    // Delete DB records
    const ids = old.map(f => f.id);
    for (const id of ids) await dbFetch(`/fotos?id=eq.${id}`, { method:'DELETE' });
    hideUploadOverlay();
    showToast(`${old.length} foto(s) deletada(s)! ✅`);
    await loadAndRenderGallery();
  } catch(err) {
    hideUploadOverlay();
    showToast('Erro ao deletar: ' + err.message);
    console.error(err);
  }
}
</script>
